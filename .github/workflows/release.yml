name: GitHub Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  release:
    name: Validate and create release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out tag
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify OIDC availability
        shell: bash
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "GitHub did not provide the OIDC environment required by npm trusted publishing."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm run pack:check

      - name: Verify version tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package version v$VERSION."
            exit 1
          fi

      - name: Publish package to npm
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          EXISTING="$(npm view "$NAME@$VERSION" version --prefer-online 2>/dev/null || true)"
          if [ "$EXISTING" = "$VERSION" ]; then
            echo "$NAME@$VERSION is already published."
          else
            npm publish --access public --provenance --tag latest
          fi

      - name: Verify npm publication
        shell: bash
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          for ATTEMPT in 1 2 3 4 5 6; do
            PUBLISHED="$(npm view "$NAME@$VERSION" version --prefer-online 2>/dev/null || true)"
            LATEST="$(npm view "$NAME" dist-tags.latest --prefer-online 2>/dev/null || true)"
            if [ "$PUBLISHED" = "$VERSION" ] && [ "$LATEST" = "$VERSION" ]; then
              echo "Verified $NAME@$VERSION on npm with the latest tag."
              exit 0
            fi
            sleep 5
          done
          echo "npm did not confirm the requested version and latest tag."
          exit 1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "node-idb $TAG"
          fi
