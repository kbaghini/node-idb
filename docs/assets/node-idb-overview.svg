<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title description">
  <title id="title">node-idb — Your documents. Your database.</title>
  <desc id="description">An embedded document database for Node.js, with SQL-style queries, local SQLite storage and a built-in browser Studio. A minimal product table illustrates selected fields.</desc>
  <rect width="1200" height="480" rx="24" fill="#f5f8f5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="50" width="36" height="36" rx="10" fill="#123d32"/>
    <g fill="none" stroke="#e0f4e8" stroke-width="2" stroke-linecap="round">
      <path d="M66 61h16M66 68h12M66 75h8"/>
      <circle cx="83" cy="76" r="2" fill="#94d9ac" stroke="none"/>
    </g>
    <text x="104" y="77" font-size="27" font-weight="700" letter-spacing="-1" fill="#153e33">node-idb</text>
    <text x="56" y="170" font-size="57" font-weight="700" letter-spacing="-2.4" fill="#162f28">Your documents.</text>
    <text x="56" y="235" font-size="57" font-weight="700" letter-spacing="-2.4" fill="#227653">Your database.</text>
    <text x="58" y="284" font-size="21" fill="#50665c">SQL-style queries. Local SQLite storage.</text>
    <text x="58" y="315" font-size="21" fill="#50665c">A browser Studio, built right in.</text>
    <rect x="56" y="356" width="277" height="52" rx="11" fill="#153e33"/>
    <text x="78" y="388" font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#f4faf6">npm install node-idb</text>
    <text x="56" y="447" font-size="13" letter-spacing="1.6" fill="#5b7064">NODE.JS  ·  TYPESCRIPT  ·  MIT</text>
    <rect x="641" y="77" width="505" height="333" rx="17" fill="#dfe8df" opacity=".55"/>
    <rect x="635" y="69" width="505" height="333" rx="17" fill="#fff" stroke="#dce6de"/>
    <path d="M635 124h505" stroke="#e6ece7"/>
    <circle cx="660" cy="97" r="4" fill="#ccd8ce"/>
    <circle cx="675" cy="97" r="4" fill="#ccd8ce"/>
    <circle cx="690" cy="97" r="4" fill="#ccd8ce"/>
    <text x="715" y="102" font-size="14" font-weight="700" fill="#395448">products</text>
    <rect x="1043" y="85" width="76" height="24" rx="12" fill="#eff6ef"/>
    <text x="1081" y="101" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#39764e">STUDIO</text>
    <g font-size="11" font-weight="700" letter-spacing="1.4" fill="#728376">
      <text x="660" y="157">SKU</text><text x="754" y="157">NAME</text><text x="1068" y="157">STOCK</text>
    </g>
    <path d="M658 174h459M658 227h459M658 280h459" stroke="#edf1ed"/>
    <g font-size="15" fill="#29473a">
      <text x="660" y="205" font-family="Consolas, monospace" fill="#788a7e">A-100</text><text x="754" y="205">Mechanical keyboard</text>
      <text x="660" y="258" font-family="Consolas, monospace" fill="#788a7e">A-101</text><text x="754" y="258">Desk lamp</text>
      <text x="660" y="311" font-family="Consolas, monospace" fill="#788a7e">A-102</text><text x="754" y="311">Everyday notebook</text>
    </g>
    <g fill="#edf6ef"><rect x="1073" y="187" width="38" height="25" rx="7"/><rect x="1073" y="240" width="38" height="25" rx="7"/><rect x="1073" y="293" width="38" height="25" rx="7"/></g>
    <g font-size="13" font-weight="700" text-anchor="middle" fill="#38744d"><text x="1092" y="204">24</text><text x="1092" y="257">18</text><text x="1092" y="310">56</text></g>
    <rect x="650" y="340" width="475" height="47" rx="9" fill="#f3f7f3"/>
    <text x="666" y="369" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#3b6550"><tspan font-weight="700" fill="#267248">SELECT</tspan> name, stock <tspan font-weight="700" fill="#267248">FROM</tspan> products</text>
  </g>
</svg>
